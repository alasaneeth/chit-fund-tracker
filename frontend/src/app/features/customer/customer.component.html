<div class="customer-page">
  <div class="page-header">
    <h2>Customers</h2>
    <button class="add-btn" (click)="openAdd()">
      <mat-icon>person_add</mat-icon>
      Add Customer
    </button>
  </div>

  <div class="search-bar">
    <mat-icon>search</mat-icon>
    <input
      type="text"
      placeholder="Search by name or phone..."
      [(ngModel)]="searchText"
    />
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let customer of filteredCustomers; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ customer.fullName }}</td>
          <td>{{ customer.email }}</td>
          <td>{{ customer.phone }}</td>
          <td>{{ customer.address }}</td>
          <td class="actions">
            <button class="edit-btn" (click)="openEdit(customer)">
              <mat-icon>edit</mat-icon>
            </button>
            <button class="delete-btn" (click)="delete(customer.id!)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </tr>
        <tr *ngIf="filteredCustomers.length === 0">
          <td colspan="6" class="empty">No customers found.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Form Modal -->
  <div class="modal-overlay" *ngIf="showForm">
    <div class="modal">
      <h3>{{ isEdit ? 'Edit Customer' : 'Add Customer' }}</h3>

      <div class="form-group">
        <label>Full Name*</label>
        <input type="text" [(ngModel)]="form.fullName" placeholder="Enter full name" />
      </div>

      <div class="form-group">
        <label>Email*</label>
        <input type="email" [(ngModel)]="form.email" placeholder="Enter email" />
      </div>

      <div class="form-group">
        <label>Phone*</label>
        <input type="text" [(ngModel)]="form.phone" placeholder="Enter phone" />
      </div>

      <div class="form-group">
        <label>Address</label>
        <input type="text" [(ngModel)]="form.address" placeholder="Enter address" />
      </div>

      <div class="modal-actions">
        <button class="cancel-btn" (click)="cancel()">Cancel</button>
        <button class="save-btn" (click)="save()">
          {{ isEdit ? 'Update' : 'Save' }}
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm Delete Dialog -->
<app-confirm-dialog
  *ngIf="showDeleteConfirm"
  title="Delete Customer"
  message="இந்த customer-ஐ delete பண்ண விரும்புகிறீர்களா? இந்த action undo பண்ண முடியாது."
  (confirmed)="confirmDelete()"
  (cancelled)="showDeleteConfirm = false">
</app-confirm-dialog>
