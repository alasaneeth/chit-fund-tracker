<div class="dashboard">
  <div class="stats-grid">
    <div class="stat-card blue">
      <div class="stat-icon">
        <mat-icon>group_work</mat-icon>
      </div>
      <div class="stat-info">
        <h3>{{ stats.totalGroups }}</h3>
        <p>Total Chit Groups</p>
      </div>
    </div>

    <div class="stat-card green">
      <div class="stat-icon">
        <mat-icon>people</mat-icon>
      </div>
      <div class="stat-info">
        <h3>{{ stats.totalCustomers }}</h3>
        <p>Total Customers</p>
      </div>
    </div>

    <div class="stat-card orange">
      <div class="stat-icon">
        <mat-icon>payments</mat-icon>
      </div>
      <div class="stat-info">
        <h3>{{ stats.totalCollections }}</h3>
        <p>Total Payments</p>
      </div>
    </div>

    <div class="stat-card purple">
      <div class="stat-icon">
        <mat-icon>how_to_reg</mat-icon>
      </div>
      <div class="stat-info">
        <h3>{{ stats.activeEnrollments }}</h3>
        <p>Total Enrollments</p>
      </div>
    </div>
  </div>
</div>
